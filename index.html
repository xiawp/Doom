<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport">
<title>DOOM</title>
<style>
  body,html{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
  #stage{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  canvas{display:block;outline:0;background:#000;width:min(100vw,calc(100vh * 4 / 3));height:min(100vh,calc(100vw * 3 / 4));image-rendering:pixelated}
  #overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;color:#c8c8c8;font:18px/1.6 monospace;text-align:center;user-select:none}
  #overlay h1{margin:0 0 .4em;font-size:56px;letter-spacing:.15em;color:#b30000}
  #overlay.ready{cursor:pointer}
  #overlay.ready #status{color:#fff;animation:blink 1.2s steps(2,start) infinite}
  #bar{margin-top:1.4em;width:min(320px,60vw);height:4px;background:#1c1c1c;overflow:hidden;border-radius:2px}
  #barfill{width:35%;height:100%;background:#b30000;animation:slide 1.1s ease-in-out infinite}
  #overlay.ready #bar{display:none}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
  @keyframes blink{to{visibility:hidden}}
</style>
</head>
<body>
<div id=stage><canvas id=canvas oncontextmenu=event.preventDefault() tabindex=0></canvas></div>
<div id=overlay>
  <h1>DOOM</h1>
  <div id=status>Loading…</div>
  <div id=bar><div id=barfill></div></div>
</div>
<script>
var overlay=document.getElementById("overlay"),
    statusEl=document.getElementById("status"),
    canvas=document.getElementById("canvas"),
    ready=!1,started=!1,
    Module={
      noInitialRun:!0,
      canvas:canvas,
      print:function(t){console.log(t)},
      printErr:function(t){console.warn(t)},
      setStatus:function(t){ready||(statusEl.textContent=t||"Loading…")},
      onRuntimeInitialized:function(){
        ready=!0,
        statusEl.textContent="Click or press any key to start",
        overlay.classList.add("ready")
      },
      onAbort:function(t){statusEl.textContent="Error: "+t}
    };

function start(){
  if(ready&&!started){
    started=!0;
    overlay.style.display="none";
    canvas.focus();
    try{Module.callMain([])}catch(t){"unwind"!==t&&console.error(t)}
  }
}

overlay.addEventListener("pointerdown",start);
window.addEventListener("keydown",(function(t){started||start()}),!0);
window.addEventListener("keydown",(function(t){
  if(started){
    var e=t.key;
    ("Tab"===e||" "===e||"Backspace"===e||0===e.indexOf("Arrow")||/^F([1-4]|[6-9]|10)$/.test(e))&&t.preventDefault()
  }
}),!0);
window.addEventListener("error",(function(t){started||(statusEl.textContent="Error: "+t.message)}));
</script>
<script async src=doom.js></script>
</body>
</html>
